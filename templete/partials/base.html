{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanitas</title>
    <!-- favicon -->
    <link rel="shortcut icon" href="./images/favicon.png" type="image/png">

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- google icons -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- font awesome -->
    <script src="{% static 'fontawesomefree/js/all.min.js' %}"></script>
    <link href="{% static 'fontawesomefree/css/all.min.css' %}" rel="stylesheet" type="text/css">

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- apps stylesheets -->
    <link rel="stylesheet" href="{% static 'assets/css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/responsive.css' %}">

</head>

<body>

    <div id="nav-bar">
        <input id="nav-toggle" type="checkbox" />
        <div id="nav-header"><a id="nav-title" href="#"><img src="../../static/assets/images/userauths/favicon.png"
                    alt=""><span>Sanitas</span></a>
            <label for="nav-toggle"><span id="nav-toggle-burger"></span></label>
            <hr />
        </div>
        <div id="nav-content">
            <div class="nav-button"><i class="fas fa-palette"></i><span>Your Work</span></div>
            <div class="nav-button"><i class="fas fa-images"></i><span>Assets</span></div>
            <div class="nav-button"><i class="fas fa-thumbtack"></i><span>Pinned Items</span></div>
            <hr />
            <div class="nav-button"><i class="fas fa-heart"></i><span>Following</span></div>
            <div class="nav-button"><i class="fas fa-chart-line"></i><span>Trending</span></div>
            <div class="nav-button"><i class="fas fa-fire"></i><span>Challenges</span></div>
            <div class="nav-button"><i class="fas fa-magic"></i><span>Spark</span></div>

            <div id="nav-content-highlight"></div>
        </div>
        <input id="nav-footer-toggle" type="checkbox" />
        <div id="nav-footer">
            <div id="nav-footer-heading">
                <div id="nav-footer-avatar"><img src="https://gravatar.com/avatar/4474ca42d303761c2901fa819c4f2547" />
                </div>
                <div id="nav-footer-titlebox"><a id="nav-footer-title" href="#">Anurag</a><span
                        id="nav-footer-subtitle">Admin</span></div>
                <label for="nav-footer-toggle"><i class="fas fa-caret-up"></i></label>
            </div>
            <div id="nav-footer-content nav-content">
                <div class="nav-button"><i class="fa-solid fa-gear"></i><span>Setting</span></div>
                <div class="nav-button"><i class="fa-solid fa-circle-half-stroke"></i><span>Switch Appearance</span>
                </div>
                <div class="nav-button"><i class="fa-solid fa-right-from-bracket"></i><span><a
                            href="{% url 'userauths:sign-out' %}">Logout</a></span></div>

                <div id="nav-footer-content-highlight"></div>
            </div>
        </div>
    </div>

    <nav class="navbar fixed-bottom" id="nav-bar">
        <div class="container-fluid">
            <div class="contain-itmes">
                <div class="nav-button active"><i class="fas fa-palette"></i></div>
                <div class="nav-button"><i class="fas fa-images"></i></div>
                <div class="nav-button"><i class="fas fa-thumbtack"></i></div>
                <div class="nav-button"><i class="fas fa-heart"></i></div>
                <div class="nav-button"><i class="fas fa-chart-line"></i></div>
                <div id="nav-highlight"></div>
            </div>
        </div>
    </nav>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var buttons = document.querySelectorAll('.nav-button');
            var highlight = document.getElementById('nav-highlight');

            buttons.forEach(function (button, index) {
                button.addEventListener('click', function () {
                    buttons.forEach(function (btn) {
                        btn.classList.remove('active');
                    });
                    this.classList.add('active');

                    var translateX = (index - 10) * 100;

                    highlight.style.transform = 'translateX(' + translateX + '%)';
                });
            });
        });
    </script>

    {% block content %}

    {% endblock content %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <!-- apps js -->
    <script src="{% static 'assets/js/userauth.js' %}"></script>
</body>

</html>
