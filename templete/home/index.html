{% extends 'partials/base.html' %}
{% load static %}

{% block content %}

<div class="col-md-12">
    <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-dark" type="submit">Search</button>
        <a href="{% url 'creation:blog-new' %}" class="btn"><i class="fa-solid fa-plus"></i></a>
    </form>
</div>
<div class="col-md-12 recent-blog">
    <span class="btn">Recent Blogs</span>
    <div class="featured-carousel owl-carousel">
        
        <div class="item">
            <div class="card">
                <img src="../../static/assets/images/blogs/sample.jpeg" class="card-img-top" alt="...">
                <div class="card-body">
                    <span class="cat">{{ p.title }}</span>
                    <time datetime="{{ p.date_posted }}">
                        <i class="fas fa-calendar-alt mr-2"></i><span style="margin-left: .2em;">12/3/2422</span>
                    </time>
                    <div class="col-md-12">
                        <a href="#" class="btn">Read More</a>
                        <a href="#" class="btn"><i class="fa-solid fa-thumbs-up"></i><span style="margin-left: .2em;">{{ p.likes.count }}</span></a>
                        <a href="#" class="btn"><i class="fa-solid fa-message"></i><span style="margin-left: .2em;">{{ comments.count }}</span></a>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div class="col-md-12 view-blog">
        <a href="{% url 'creation:blog' %}"><button class="btn">View All</button></a>
    </div>
</div>
<div class="col-md-12 recent-map">
    <span class="btn">Sanitas Map</span>
    <div class="featured-map">
        
    </div>
</div>

{% endblock content %}
