{% extends 'partials/base.html' %}
{% load static %}

{% block content %}


<form method="post">
    {% csrf_token %}
    <section class="light">
            <div class="container-fluid" style="padding-left: 0;">
                <div class="be-comment-block">
                    <span class="blogs_head">Edit Your Comment <hr></span>
                    <div class="be-comment" style="padding: 1em 0;">
                        <div class="be-img-comment">
                            <img loading="lazy" src="{{ post.authorProfile.profile_image.url }}" alt="" class="be-ava-comment">
                        </div>
                        <div class="be-comment-content">

                            <span class="comment-user">{{ comment.author }}</span>                            </span>
                            <span class="be-comment-time">
                                <i class="fas fa-calendar-alt"></i>
                                {{ comment.created_at }}
                            </span>

                            <p>
                                {{ form.text }}
                            </p>
                            
                            <button class="comment-btn" type="submit">Save Changes</button>
                        </div>
                        <style>
                            #id_text{
                                width: 100%;
                                height: 6em;
                                font-size: 1.2em;
                                overflow-y: auto;
                                border-radius: .5em;
                                padding: .3em;
                                border-color: var(--navbar-light-primary);
                                color: white;
                                background: var(--navbar-light-secondary);
                            }
                            #id_text:focus-visible {
                                outline: none;
                                border: 1px solid var(--navbar-dark-primary);
                            }
                            .comment-btn{
                                font-size: 1em;
                                background: transparent;
                                color: var(--navbar-dark-primary);
                                padding: .2em 2em;
                                box-shadow: none;
                                border: 1px solid var(--navbar-dark-primary);
                                border-radius: .4em;
                            }
                            .comment-btn:hover {
                                background: var(--navbar-dark-secondary);
                            }
                            .comment-btn:focus{
                                background: var(--navbar-dark-secondary);
                                box-shadow: none
                            }
                            .comment-btn:active {
                                background: var(--navbar-dark-secondary);
                                box-shadow: none
                            }
                        </style>
                    </div>
                    <hr>
                </div>
            </div>
    </section>
    
</form>

{% endblock %}
