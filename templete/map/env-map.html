{% extends 'partials/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet"
    href="https://apis.mapmyindia.com/advancedmaps/v1/9440dc184957cb68062acbd0187f20f5/map_sdk_plugins.css">
<script
    src="https://apis.mapmyindia.com/advancedmaps/v1/9440dc184957cb68062acbd0187f20f5/map_load?v=1.5&plugins=heatmap"></script>
<style>
    #map-container {
        width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
        position: absolute;
        top: 0;
        left: 0;
    }

    #dataTypeSelector,
    .search-box,
    #stateSelector,
    #bignav {
        z-index: 1000;
    }
    #dataTypeSelector,
    #stateSelector {
        margin-top: .5em;
        color: var(--navbar-dark-primary);
        margin-left: 1vw;
        border-radius: .3em;
        max-width: 10em;
        font-size: .8em;
        border: 1px solid var(--navbar-dark-primary);
        background-color: var(--navbar-light-secondary);
        border-radius: .3em;
    }

    #stateSelector select {
        font-size: .8em;
        padding: .1em 1em;
        border: 1px solid var(--navbar-dark-primary);
        background-color: var(--navbar-light-secondary);
    }

    #stateSelector label {
        font-weight: 700;
    }

    .search-box input {
        background-color: var(--navbar-light-secondary);
        border: 1px solid var(--navbar-dark-primary);
    }

    .search-box .btn {
        background-color: var(--navbar-light-secondary);
    }

    #flsc_dv {
        margin-top: 5em;
        margin-right: .4em;
    }
</style>

<div id="map-container"></div>
<select id="stateSelector" class="col-md-12">
    <option value="">Select State</option>
    <option value="Total">Total</option>
    <option value="Andhra Pradesh">Andhra Pradesh</option>
    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
    <option value="Assam">Assam</option>
    <option value="Bihar">Bihar</option>
    <option value="Chhattisgarh">Chhattisgarh</option>
    <option value="Goa">Goa</option>
    <option value="Gujarat">Gujarat</option>
    <option value="Haryana">Haryana</option>
    <option value="Himachal Pradesh">Himachal Pradesh</option>
    <option value="Jharkhand">Jharkhand</option>
    <option value="Karnataka">Karnataka</option>
    <option value="Kerala">Kerala</option>
    <option value="Madhya Pradesh">Madhya Pradesh</option>
    <option value="Maharashtra">Maharashtra</option>
    <option value="Manipur">Manipur</option>
    <option value="Meghalaya">Meghalaya</option>
    <option value="Mizoram">Mizoram</option>
    <option value="Nagaland">Nagaland</option>
    <option value="Odisha">Odisha</option>
    <option value="Punjab">Punjab</option>
    <option value="Rajasthan">Rajasthan</option>
    <option value="Sikkim">Sikkim</option>
    <option value="Tamil Nadu">Tamil Nadu</option>
    <option value="Telangana">Telangana</option>
    <option value="Tripura">Tripura</option>
    <option value="Uttar Pradesh">Uttar Pradesh</option>
    <option value="Uttarakhand">Uttarakhand</option>
    <option value="West Bengal">West Bengal</option>
    <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
    <option value="Chandigarh">Chandigarh</option>
    <option value="Dadra and Nagar Haveli">Dadra and Nagar Haveli</option>
    <option value="Daman and Diu">Daman and Diu</option>
    <option value="Delhi">Delhi</option>
    <option value="Lakshadweep">Lakshadweep</option>
    <option value="Puducherry">Puducherry</option>
</select>

<select id="dataTypeSelector" class="col-md-12">
    <option value="airQuality">Air Quality</option>
    <option value="waterQuality">Water Quality</option>
</select>

<script>

    var map = new MapmyIndia.Map('map-container', {
        center: [20.5937, 78.9629],
        zoom: 5,
        search: false
    });

    function addDataLayer(selectedState = '', dataType = 'airQuality') {
        let apiUrl = '';
        let processData = null;

        if (dataType === 'airQuality') {
            apiUrl = 'https://api.data.gov.in/resource/3b01bcb8-0b14-4abf-b6f2-c1bfd384ba69?api-key=579b464db66ec23bdd0000010b9bcf2c995e46e9552e486f6a2333aa&format=json&offset=1000&limit=100000';
            processData = function (record) {
                var color = record.pollutant_avg > 100 ? 'red' : 'green';
                L.circle([record.latitude, record.longitude], {
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.5,
                    radius: 800
                }).addTo(map).bindPopup(
                    "City: " + record.city + "<br>" +
                    "State: " + record.state + "<br>" +
                    "Last Update: " + record.last_update + "<br>" +
                    "Min Pollution: " + record.pollutant_min + "<br>" +
                    "Average Pollution: " + record.pollutant_avg + "<br>" +
                    "Max Pollution: " + record.pollutant_max
                );
            };
        } else if (dataType === 'waterQuality') {

            apiUrl = 'https://api.data.gov.in/resource/4f0eafdc-35de-4448-b735-248f7daaa9d7?api-key=579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b&format=json&offset=0&limit=17';
            processData = function (record) {
                if (selectedState === '' || record.state === selectedState) {
                    function getStateCoords(stateName) {
                        var stateCoords = {
                            "Andhra Pradesh": { lat: 15.9129, lng: 79.7400 },
                            "Arunachal Pradesh": { lat: 28.2180, lng: 94.7278 },
                            "Assam": { lat: 26.2006, lng: 92.9376 },
                            "Bihar": { lat: 25.0961, lng: 85.3131 },
                            "Chhattisgarh": { lat: 21.2787, lng: 81.8661 },
                            "Goa": { lat: 15.2993, lng: 74.1240 },
                            "Gujarat": { lat: 22.2587, lng: 71.1924 },
                            "Haryana": { lat: 29.0588, lng: 76.0856 },
                            "Himachal Pradesh": { lat: 31.1048, lng: 77.1734 },
                            "Jharkhand": { lat: 23.6102, lng: 85.2799 },
                            "Karnataka": { lat: 15.3173, lng: 75.7139 },
                            "Kerala": { lat: 10.8505, lng: 76.2711 },
                            "Madhya Pradesh": { lat: 22.9734, lng: 78.6569 },
                            "Maharashtra": { lat: 19.7515, lng: 75.7139 },
                            "Manipur": { lat: 24.6637, lng: 93.9063 },
                            "Meghalaya": { lat: 25.4670, lng: 91.3662 },
                            "Mizoram": { lat: 23.1645, lng: 92.9376 },
                            "Nagaland": { lat: 26.1584, lng: 94.5624 },
                            "Odisha": { lat: 20.9517, lng: 85.0985 },
                            "Punjab": { lat: 31.1471, lng: 75.3412 },
                            "Rajasthan": { lat: 27.0238, lng: 74.2179 },
                            "Sikkim": { lat: 27.5330, lng: 88.5122 },
                            "Tamil Nadu": { lat: 11.1271, lng: 78.6569 },
                            "Telangana": { lat: 18.1124, lng: 79.0193 },
                            "Tripura": { lat: 23.9408, lng: 91.9882 },
                            "Uttar Pradesh": { lat: 26.8467, lng: 80.9462 },
                            "Uttarakhand": { lat: 30.0668, lng: 79.0193 },
                            "West Bengal": { lat: 22.9868, lng: 87.8550 },
                            "Andaman and Nicobar Islands": { lat: 11.7401, lng: 92.6586 },
                            "Chandigarh": { lat: 30.7333, lng: 76.7794 },
                            "Dadra and Nagar Haveli": { lat: 20.1809, lng: 73.0169 },
                            "Daman and Diu": { lat: 20.4283, lng: 72.8397 },
                            "Delhi": { lat: 28.7041, lng: 77.1025 },
                            "Lakshadweep": { lat: 10.5667, lng: 72.6417 },
                            "Puducherry": { lat: 11.9416, lng: 79.8083 }
                        };
                        return stateCoords[stateName];
                    }
                    
                    var coords = getStateCoords(record.state);
                    var affectedMetals = [
                        { name: "fluoride", count: record.number_of_quality_affected_habitations___fluoride___total_no_, color: "blue" },
                        { name: "arsenic", count: record.number_of_quality_affected_habitations___arsenic___total_no_, color: "red" },
                        { name: "iron", count: record.number_of_quality_affected_habitations___iron, color: "orange" },
                        { name: "salinity", count: record.number_of_quality_affected_habitations___salinity, color: "green" },
                        { name: "nitrate", count: record.number_of_quality_affected_habitations___nitrate, color: "yellow" },
                        { name: "heavy_metal", count: record.number_of_quality_affected_habitations___heavy_metal, color: "grey" }
                    ];
                    affectedMetals.forEach(function (metal) {
                        if (metal.count !== "NA" && metal.count > 0) {
                            var coords = getStateCoords(record.state);
                            var radius = metal.count * 10; 
                            L.circle([coords.lat, coords.lng], {
                                color: metal.color,
                                fillColor: metal.color,
                                fillOpacity: 0.7,
                                radius: radius
                            }).addTo(map).bindPopup(
                                "State: " + record.state + "<br>" +
                                "Affected by: " + metal.name + "<br>" +
                                "Number of affected habitations: " + metal.count
                            );
                        }
                    });
                }
            };

        }

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                map.eachLayer(function (layer) {
                    if (!!layer.toGeoJSON) {
                        map.removeLayer(layer);
                    }
                });
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: 'Map data &copy; OpenStreetMap contributors',
                    maxZoom: 18,
                }).addTo(map);

                data.records.forEach(processData);
            })
            .catch(error => console.error('Error fetching data:', error));
    }

    document.getElementById('dataTypeSelector').addEventListener('change', function () {
        const selectedState = document.getElementById('stateSelector').value;
        addDataLayer(selectedState, this.value);
    });

    document.getElementById('stateSelector').addEventListener('change', function () {
        const dataType = document.getElementById('dataTypeSelector').value;
        addDataLayer(this.value, dataType);
    });

    document.addEventListener('DOMContentLoaded', function () {
        addDataLayer('', 'airQuality');
    });
</script>

{% endblock content %}
