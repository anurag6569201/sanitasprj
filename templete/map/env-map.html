{% extends 'partials/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet"
    href="https://apis.mapmyindia.com/advancedmaps/v1/9440dc184957cb68062acbd0187f20f5/map_sdk_plugins.css">
<script
    src="https://apis.mapmyindia.com/advancedmaps/v1/9440dc184957cb68062acbd0187f20f5/map_load?v=1.5&plugins=heatmap"></script>
<style>
    #map-container {
        width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
        position: absolute;
        top: 0;
        left: 0;
    }
    .search-box,
    #stateSelector,
    #bignav {
        z-index: 1000;
    }

    #stateSelector {
        margin-top: .5em;
        color: var(--navbar-dark-primary);
        margin-left: 1vw;
        border-radius: .3em;
        max-width: 10em;font-size: .8em;
        border: 1px solid var(--navbar-dark-primary);
        background-color: var(--navbar-light-secondary);
        border-radius: .3em;
    }

    #stateSelector select {
        font-size: .8em;
        padding: .1em 1em;
        border: 1px solid var(--navbar-dark-primary);
        background-color: var(--navbar-light-secondary);
    }

    #stateSelector label {
        font-weight: 700;
    }

    .search-box input {
        background-color: var(--navbar-light-secondary);
        border: 1px solid var(--navbar-dark-primary);
    }

    .search-box .btn {
        background-color: var(--navbar-light-secondary);
    }

    #flsc_dv {
        margin-top: 5em;
        margin-right: .4em;
    }
</style>

<div id="map-container"></div>
<select id="stateSelector" class="col-md-12">
    <option value="">Select State</option>
    <option value="Andhra Pradesh">Andhra Pradesh</option>
    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
    <option value="Assam">Assam</option>
    <option value="Bihar">Bihar</option>
    <option value="Chhattisgarh">Chhattisgarh</option>
    <option value="Goa">Goa</option>
    <option value="Gujarat">Gujarat</option>
    <option value="Haryana">Haryana</option>
    <option value="Himachal Pradesh">Himachal Pradesh</option>
    <option value="Jharkhand">Jharkhand</option>
    <option value="Karnataka">Karnataka</option>
    <option value="Kerala">Kerala</option>
    <option value="Madhya Pradesh">Madhya Pradesh</option>
    <option value="Maharashtra">Maharashtra</option>
    <option value="Manipur">Manipur</option>
    <option value="Meghalaya">Meghalaya</option>
    <option value="Mizoram">Mizoram</option>
    <option value="Nagaland">Nagaland</option>
    <option value="Odisha">Odisha</option>
    <option value="Punjab">Punjab</option>
    <option value="Rajasthan">Rajasthan</option>
    <option value="Sikkim">Sikkim</option>
    <option value="Tamil Nadu">Tamil Nadu</option>
    <option value="Telangana">Telangana</option>
    <option value="Tripura">Tripura</option>
    <option value="Uttar Pradesh">Uttar Pradesh</option>
    <option value="Uttarakhand">Uttarakhand</option>
    <option value="West Bengal">West Bengal</option>
    <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
    <option value="Chandigarh">Chandigarh</option>
    <option value="Dadra and Nagar Haveli">Dadra and Nagar Haveli</option>
    <option value="Daman and Diu">Daman and Diu</option>
    <option value="Delhi">Delhi</option>
    <option value="Lakshadweep">Lakshadweep</option>
    <option value="Puducherry">Puducherry</option>
</select>


<script>

    var map = new MapmyIndia.Map('map-container', {
        center: [20.5937, 78.9629],
        zoom: 5,
        search: false
    });

    function addAirQualityLayer(selectedState = '') {
        fetch('https://api.data.gov.in/resource/3b01bcb8-0b14-4abf-b6f2-c1bfd384ba69?api-key=579b464db66ec23bdd0000010b9bcf2c995e46e9552e486f6a2333aa&format=json&offset=1000&limit=100000')
            .then(response => response.json())
            .then(data => {
                map.eachLayer(function (layer) {
                    if (!!layer.toGeoJSON) {
                        map.removeLayer(layer);
                    }
                });
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: 'Map data &copy; OpenStreetMap contributors',
                    maxZoom: 18,
                }).addTo(map);

                data.records.forEach(function (record) {
                    if (selectedState === '' || record.state === selectedState) {
                        var color = record.pollutant_avg > 100 ? 'red' : 'green';
                        L.circle([record.latitude, record.longitude], {
                            color: color,
                            fillColor: color,
                            fillOpacity: 0.5,
                            radius: 800
                        }).addTo(map).bindPopup(
                            "City: " + record.city + "<br>" +
                            "State: " + record.state + "<br>" +
                            "Last Update: " + record.last_update + "<br>" +
                            "Min Pollution: " + record.pollutant_min + "<br>" +
                            "Average Pollution: " + record.pollutant_avg + "<br>" +
                            "Max Pollution: " + record.pollutant_max
                        );
                    }
                });
            })
            .catch(error => console.error('Error fetching air quality data:', error));
    }

    document.getElementById('stateSelector').addEventListener('change', function () {
        addAirQualityLayer(this.value);
    });

    document.addEventListener('DOMContentLoaded', function () {
        addAirQualityLayer();
    });
</script>

{% endblock content %}
