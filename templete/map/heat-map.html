{% extends 'partials/base.html' %}
{% load static %}

{% block content %}
<script src="https://apis.mapmyindia.com/advancedmaps/v1/9440dc184957cb68062acbd0187f20f5/map_load?v=1.5&plugins=heatmap"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div id="map"></div>
<div id="diseaseSelection" class="col-md-12">
    <label for="disease1">Select Disease:</label>
    <select id="disease1" onchange="updateHeatmap()">
        <option value="all">Show All</option>
        {% for disease_name, disease_cases in top_diseases %}
        <option value="{{disease_name}}">{{disease_name}}</option>
        {% endfor %}
    </select>
    <button onclick="updateHeatmap()">Show Heatmap</button>
</div>

<script>
    function generateRandomCoordinates(centerLatitude, centerLongitude, radiusInKm) {
        const radiusInDegrees = radiusInKm / 111.32;

        const randomDistance = Math.random() * radiusInDegrees;
        const randomAngle = Math.random() * 2 * Math.PI;

        const newLatitude = centerLatitude + (randomDistance * Math.cos(randomAngle));
        const newLongitude = centerLongitude + (randomDistance * Math.sin(randomAngle));

        return [newLatitude, newLongitude];
    }

    var map = new MapmyIndia.Map('map', { center: [20.293944, 85.744450], zoom: 4, search: true, hybrid: true });

    var diseaseData = {
        {% for sn_verified in sanit %}
        {% if sn_verified.is_verified %}
        {% for disease_name, disease_cases in top_diseases %}
        "{{ disease_name }}": [
            {% for disease_case in top_diseases %}
            generateRandomCoordinates({{ sn_verified.latitude }}, {{ sn_verified.longitude }}, 10),
            {% endfor %}
        ],
        {% endfor %}
        {% endif %}
        {% endfor %}
    };

    function updateHeatmap() {
        var selectedDisease = document.getElementById("disease1").value;
        var gradients = {
            {% for disease_name, disease_cases in top_diseases %}
            "{{disease_name}}": { 0.3: colors[{{forloop.counter0}}], 0.6: colors[{{forloop.counter0}}], 0.8: colors[{{forloop.counter0}}] },
            {% endfor %}
        };

        map.eachLayer(function (layer) {
            if (!(layer instanceof L.TileLayer)) {
                map.removeLayer(layer);
            }
        });

        if (selectedDisease === "all") {
            for (var disease in diseaseData) {
                var heat = L.heatLayer(diseaseData[disease], { minOpacity: .5, radius: 25, gradient: gradients[disease] });
                map.addLayer(heat);
            }
        } else {
            var data = diseaseData[selectedDisease];
            var heat = L.heatLayer(data, { minOpacity: .5, radius: 25, gradient: gradients[selectedDisease] });
            map.addLayer(heat);
        }
    }
    var colors = ["yellow", "green", "pink", "blue", "red", "grey", "purple"];
    var diseaseColors = {
        {% for disease_name, disease_cases in top_diseases %}
        "{{ disease_name }}": colors[{{ forloop.counter0 }}],
        {% endfor %}
    };

    var legend = L.control({ position: 'bottomright' });

    legend.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'info legend');
        div.style.backdropFilter = 'blur(3px)';
        div.style.border = '1px solid #12372a';
        div.style.padding = '4px';
        div.innerHTML += '<h4>Disease Legend</h4>';
        for (var disease in diseaseColors) {
            div.innerHTML += '<i style="font-size:14px;background:' + diseaseColors[disease] + '; border-radius: 50%; display: inline-block; width: 10px; height: 10px;"></i> ' + disease + '<br>';
        }
        return div;
    };

    legend.addTo(map);
</script>

{% endblock content %}
