{% extends 'partials/base.html' %}
{% load static %}

{% block content %}
<script src="https://apis.mapmyindia.com/advancedmaps/v1/9440dc184957cb68062acbd0187f20f5/map_load?v=1.5&plugins=heatmap"></script>


<div id="map"></div>
<div id="diseaseSelection" class="col-md-12">
    <label for="disease1">Select Disease:</label>
    <select id="disease1" onchange="updateHeatmap()">
        <option value="all">Show All</option>
        <option value="malaria">Malaria</option>
        <option value="cholera">Cholera</option>
        <option value="dengue">Dengue</option>
    </select>
    <button onclick="updateHeatmap()">Show Heatmap</button>
</div>

<script>

    var map = new MapmyIndia.Map('map', { center: [20.293944, 85.744450], zoom: 4, search: true, hybrid: true });

    var diseaseData = {
        "malaria": [
            [20.293944, 85.744450, 0.8],
            [20.289718, 85.754729, 0.7],
            [20.286558, 85.749643, 0.6],
            [20.283841, 85.740030, 0.5],
            [20.284042, 85.758977, 0.4],
            [20.275362, 85.765781, 0.3]
        ],
        "dengue": [
            [22.897916, 79.671862, 0.8],
            [22.897916, 79.671362, 0.7],
            [22.897916, 79.671762, 0.6],
            [22.897916, 79.671062, 0.5],
            [22.897916, 79.671162, 0.4],
            [22.897916, 79.671462, 0.3]
        ]
    };

    function updateHeatmap() {
        var selectedDisease = document.getElementById("disease1").value;
        var gradients = {
            "malaria": { 0.3: 'yellow', 0.6: 'orange', 0.8: 'red' },
            "cholera": { 0.3: 'green', 0.6: 'blue', 0.8: 'purple' },
            "dengue": { 0.3: 'pink', 0.6: 'brown', 0.8: 'black' }
        };

        map.eachLayer(function (layer) {
            if (!(layer instanceof L.TileLayer)) {
                map.removeLayer(layer);
            }
        });

        if (selectedDisease === "all") {
            for (var disease in diseaseData) {
                var heat = L.heatLayer(diseaseData[disease], { minOpacity: .5, radius: 25, gradient: gradients[disease] });
                map.addLayer(heat);
            }
        } else {
            var data = diseaseData[selectedDisease];
            var heat = L.heatLayer(data, { minOpacity: .5, radius: 25, gradient: gradients[selectedDisease] });
            map.addLayer(heat);
        }
    }
    var diseaseColors = {
        "malaria": "yellow",
        "cholera": "green",
        "dengue": "pink"
    };

    var legend = L.control({ position: 'bottomright' });

    legend.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'info legend');
        div.style.backdropFilter = 'blur(3px)';
        div.style.border = '1px solid #12372a';
        div.style.padding = '4px';
        div.innerHTML += '<h4>Disease Legend</h4>';
        for (var disease in diseaseColors) {
            div.innerHTML += '<i style="font-size:14px;background:' + diseaseColors[disease] + '; border-radius: 50%; display: inline-block; width: 10px; height: 10px;"></i> ' + disease + '<br>';
        }
        return div;
    };

    legend.addTo(map);
</script>

{% endblock content %}
