{% extends 'partials/base_auth.html' %}
{% load static %}

{% block content %}
<div class="container">
    <div class="main-container">
        <div class="main-content">
            <div class="computer-frame">
                <div class="computer">
                    <img src="https://www.bebold.ch/img/home/macbook-white.png" alt="MacBook Computer Apple">
                    <div class="slide-content">
                        <div class="gif gif1" style="background-position-y: 50%;"></div>
                        <div class="gif gif2" style="background-position-y: 50%;"></div>
                        <div class="gif gif3" style="background-position-y: 50%;"></div>
                        <div class="gif gif4" style="background-position-y: 50%;"></div>
                        <div class="gif gif5" style="background-position-y: 50%;"></div>
                    </div>
                    <script>
                        var slideIndex = 0;
                        showSlides();

                        function showSlides() {
                            var i;
                            var slides = document.getElementsByClassName("gif");
                            for (i = 0; i < slides.length; i++) {
                                slides[i].style.opacity = "0";
                                slides[i].style.visibility = "hidden";
                            }
                            slideIndex++;
                            if (slideIndex > slides.length) {slideIndex = 1}
                            slides[slideIndex-1].style.opacity = "1";
                            slides[slideIndex-1].style.visibility = "visible";
                            setTimeout(showSlides, 2000);
                        }
                    </script>
                </div>
            </div>
            <div class="form-container">
                <div class="form-content box">
                    <div class="logo">
                        <img src="{% static 'assets/images/userauths/logo.png' %}" alt="Sanitas logo" class="logo-light">
                        <img src="{% static 'assets/images/userauths/logo.png' %}" alt="Sanitas logo" class="logo-dark">
                    </div>


                    <form method="POST">
                        {% csrf_token %}
                        <div class="signin-form" id="signin-form">
                            <div class="form-group">
                                <div class="animate-input">
                                    <span>
                                        Enter email
                                    </span>
                                    <input class="login-signup-input" type="text" name="email" maxlength="100" required="" id="login_username">
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="animate-input">
                                    <span>
                                        Enter Password
                                    </span>
                                    <input class="login-signup-input" type="password" name="password" autocomplete="current-password" required="" id="login_password">
                                    <button>Show</button>
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="btn-login" id="signin-btn" type="submit">
                                    Sign In
                                </button>
                            </div>
                            <!-- <div class="divine">
                                <div></div>
                                <div>OR</div>
                                <div></div>
                            </div>
                            <div class="btn-group">
                                <button class="btn-fb">
                                    <img src="{% static 'assets/images/userauths/facebook-icon.png' %}" alt="">
                                    <span>Log in with Facebook</span>
                                </button>
                            </div> -->
                            <!-- <a href="#" class="forgot-pw">Forgot password?</a> -->
                            <!-- <a href="#" id="darkmode-toggle">Darkmode</a> -->
                        </div>
                    </form>


                </div>
                <div class="box goto">
                    <p>
                        Don't have an account?
                        <a href="{% url 'userauths:sign-up' %}">Sign up</a>
                    </p>
                </div>

            </div>
        </div>
    </div>
    <div class="footer">
        <div class="links">
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Help</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Locations</a>
            
        </div>
        <div class="copyright">
            © 2024 Sanitas from Earth
        </div>
    </div>
</div>
{% endblock content %}
