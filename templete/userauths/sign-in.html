{% extends 'partials/base_auth.html' %}
{% load static %}

{% block content %}
<div class="container">
    <div class="main-container">
        <div class="main-content">
            <div class="slide-container" style="background-image: url(../../static/assets/images/userauths/phone-frame.png);">
                <div class="slide-content" id="slide-content">
                    <img src="{% static 'assets/images/userauths/slide (1).jpg' %}" alt="slide image" class="active">
                    <img src="{% static 'assets/images/userauths/slide (2).jpg' %}" alt="slide image">
                    <img src="{% static 'assets/images/userauths/slide (3).jpg' %}" alt="slide image">
                    <img src="{% static 'assets/images/userauths/slide (4).jpg' %}" alt="slide image">
                    <img src="{% static 'assets/images/userauths/slide (5).jpg' %}" alt="slide image">
                </div>
            </div>
            <div class="form-container">
                <div class="form-content box">
                    <div class="logo">
                        <img src="{% static 'assets/images/userauths/logo.png' %}" alt="Sanitas logo" class="logo-light">
                        <img src="{% static 'assets/images/userauths/logo.png' %}" alt="Sanitas logo" class="logo-dark">
                    </div>


                    <form method="POST">
                        {% csrf_token %}
                        <div class="signin-form" id="signin-form">
                            <div class="form-group">
                                <div class="animate-input">
                                    <span>
                                        Enter email
                                    </span>
                                    <input class="login-signup-input" type="text" name="email" maxlength="100" required="" id="login_username">
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="animate-input">
                                    <span>
                                        Enter Password
                                    </span>
                                    <input class="login-signup-input" type="password" name="password" autocomplete="current-password" required="" id="login_password">
                                    <button>Show</button>
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="btn-login" id="signin-btn" type="submit">
                                    Sign In
                                </button>
                            </div>
                            <!-- <div class="divine">
                                <div></div>
                                <div>OR</div>
                                <div></div>
                            </div>
                            <div class="btn-group">
                                <button class="btn-fb">
                                    <img src="{% static 'assets/images/userauths/facebook-icon.png' %}" alt="">
                                    <span>Log in with Facebook</span>
                                </button>
                            </div> -->
                            <!-- <a href="#" class="forgot-pw">Forgot password?</a> -->
                            <!-- <a href="#" id="darkmode-toggle">Darkmode</a> -->
                        </div>
                    </form>


                </div>
                <div class="box goto">
                    <p>
                        Don't have an account?
                        <a href="{% url 'userauths:sign-up' %}">Sign up</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

</div>
{% endblock content %}
