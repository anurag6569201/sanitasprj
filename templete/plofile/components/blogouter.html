{% load static %}
<div class="item mx-1 col-md-12">
    <div class="card" style="overflow: hidden;">
        <div class="row col-md-12 col-12">
            <a class="col-md-4" href="{% url 'creation:blog-detail' p.id %}">
                <img loading="lazy" class="col-md-4 col-4" src="{{ p.image.url }}" class="card-img-top" alt="..." style="min-width: 100%;max-height: 260px;object-fit: cover;">
            </a>
            <div class="card-body col-md-8 col-8" style="padding: 10px;">
                <div class="my-1">
                    <div class="ck ck-content" style="max-height: 100px;overflow: hidden;">{{ p.content|safe }}</div>
                </div>
                <time datetime="{{ p.date_posted }}" style="color: var(--navbar-dark-primary); font-size: 0.9em;">
                    <i class="fas fa-calendar-alt mr-2"></i><span style="margin-left: .2em;">{{ p.date_posted }}</span>
                </time>
                <div class="col-md-12" style="margin-top: 10px;">
                    <a href="{% url 'creation:blog-detail' p.id %}" class="btn btn-primary">Read More</a>
                    <a href="{% url 'creation:like-post' pk=p.id %}" class="btn btn-secondary"><i class="fa-solid fa-thumbs-up"></i><span style="margin-left: .2em;">{{ p.likes.count }}</span></a>
                    <a href="{% url 'creation:blog-detail' p.id %}" class="btn btn-secondary"><i class="fa-solid fa-message"></i><span style="margin-left: .2em;">{{ comments.count }}</span></a>
                </div>
                
            </div>
        </div>
    </div>
</div>
